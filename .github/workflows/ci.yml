name: Alaya CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "codex/**"]
  pull_request:
    branches: [main]

jobs:
  unit-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: package-lock.json

      # workspaces 仓库：根目录单次 npm ci 安装全部依赖（子包内 npm ci 会操作根项目并清空 node_modules，禁止使用）
      - name: Install dependencies (workspaces)
        run: npm ci

      - name: Secret scan
        run: npm run secret:scan

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: PRINCIPLES guard
        run: npm run guard

      - name: App focused regression tests
        working-directory: alaya-app
        run: >
          node --import tsx --test
          tests/principles.guard.test.ts
          tests/flywheel.round4.test.ts
          tests/knowledgeInjection.test.ts
          tests/flywheelHealth.api.test.ts
          tests/update_confidence.decay.test.ts

      - name: App full test suite
        run: npm --prefix alaya-app test

      - name: App typecheck
        run: npm --prefix alaya-app run check

      - name: Core full test suite
        run: npm --prefix alaya-core test

      - name: Core typecheck
        run: npm --prefix alaya-core run typecheck

      - name: Root script tests
        run: npm run test:scripts

      - name: M1 output provenance regression (offline)
        run: python3 -B -m unittest discover -s experiments/evolution-mvp -p 'test_run_m1.py' -v

      - name: Benchmark smoke
        run: npm run benchmark:smoke

      - name: Docker build
        run: docker build -t alaya:ci .

      - name: Flywheel simulation
        run: npm --prefix alaya-core run flywheel
        env:
          CI: "true"
